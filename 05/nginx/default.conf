server {
    listen 80;

    # 讀取 static html
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # 反向代理到 Node.js 後端
    location /api {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}