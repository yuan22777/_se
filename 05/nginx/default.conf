server {
    listen 80;

    # 簡易前端展示頁面
    location / {
        default_type text/html;
        return 200 '
        <!DOCTYPE html>
        <html lang="zh-TW">
        <head>
            <meta charset="UTF-8">
            <title>Docker 微服務架構展示</title>
            <style>
                body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f9; }
                .card { background: white; padding: 20px; border-radius: 8px; display: inline-block; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
                button { padding: 10px 20px; font-size: 16px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
                pre { background: #eee; padding: 10px; border-radius: 4px; text-align: left; }
            </style>
        </head>
        <body>
            <div class="card">
                <h1>🐳 Docker 微服務展示系統</h1>
                <p>Nginx (Reverse Proxy) → Node.js (API) → PostgreSQL (Database)</p>
                <button onclick="fetchData()">測試 API 與資料庫連線</button>
                <h3>API 回傳結果：</h3>
                <pre id="result">點擊上方按鈕進行測試...</pre>
            </div>

            <script>
                async function fetchData() {
                    const res = await fetch("/api");
                    const data = await res.json();
                    document.getElementById("result").innerText = JSON.stringify(data, null, 2);
                }
            </script>
        </body>
        </html>
        ';
    }

    # 反向代理：將 /api 請求轉發至 Node.js 後端容器
    location /api {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}