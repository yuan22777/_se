<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>資工專業辭典 CS Dictionary | MVP</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#1a2333;--muted:#667085;--brand:#2563eb;--brand2:#1e40af;--warn:#fef3c7;--line:#e6e9f2;--tag:#eef2ff;--tag2:#f1f5f9}
*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px 60px}
header.top{position:sticky;top:0;z-index:20;background:rgba(246,247,251,.95);backdrop-filter:blur(6px);padding:14px 0 10px;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:22px}h1 small{font-size:13px;color:var(--muted);font-weight:400;margin-left:8px}
.sub{color:var(--muted);font-size:13px;margin:4px 0 0}
.searchbox{position:relative;margin-top:12px}
.searchbox input{width:100%;padding:14px 44px 14px 16px;font-size:17px;border:2px solid var(--brand);border-radius:12px;outline:none;background:#fff}
.searchbox .icon{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:20px}
.dropdown{position:absolute;left:0;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.12);overflow:hidden;display:none;max-height:340px;overflow-y:auto}
.dropdown.show{display:block}
.dd-item{padding:10px 14px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid #f1f3f9}
.dd-item:hover{background:#f3f6ff}.dd-item b{font-size:15px}.dd-item span{color:var(--muted);font-size:13px}
.dd-label{padding:8px 14px;font-size:12px;color:var(--muted);background:#f8fafc}
.correct{background:var(--warn);border:1px solid #fcd34d;border-radius:10px;padding:10px 14px;margin-top:12px;font-size:14px;display:none}
.correct.show{display:block}.correct button{margin:4px 6px 0 0;border:1px solid #d97706;background:#fff;border-radius:20px;padding:4px 12px;cursor:pointer}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 6px}
.pill{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 14px;font-size:14px;cursor:pointer}
.pill.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.tag{background:var(--tag);color:var(--brand2);border-radius:8px;padding:4px 10px;font-size:13px;cursor:pointer;border:none}
.tag:hover{background:#dbeafe}
.meta{color:var(--muted);font-size:13px;margin:10px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;transition:.15s}
.card:hover{box-shadow:0 6px 20px rgba(37,99,235,.15);transform:translateY(-1px)}
.card h3{margin:0 0 2px;font-size:17px}.card h3 span{color:var(--muted);font-weight:400;font-size:14px}
.card p{margin:8px 0;font-size:14px;color:#334155;line-height:1.55}
.mini{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.mini i{font-style:normal;font-size:12px;background:var(--tag2);border-radius:6px;padding:2px 8px;color:#475569}
.mini i.sc{background:#ecfdf5;color:#047857}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal.show{display:flex}.sheet{background:#fff;border-radius:16px;max-width:640px;width:100%;max-height:88vh;overflow-y:auto;padding:22px;position:relative}
.sheet .x{position:absolute;right:12px;top:12px;border:none;background:#f1f5f9;border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:16px}
.sheet h2{margin:0}.full{color:var(--muted);font-size:13px}.def{background:#f8fafc;border-left:4px solid var(--brand);padding:10px 12px;border-radius:0 8px 8px 0;margin:12px 0;line-height:1.6}
.ex{background:#fffbeb;border:1px dashed #d97706;border-radius:8px;padding:10px 12px;font-size:14px}
footer{margin-top:26px;color:var(--muted);font-size:12px;text-align:center}
.hint{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:13px;color:var(--muted);margin-top:12px}
.hint code{background:#f1f5f9;padding:1px 6px;border-radius:6px;cursor:pointer}
</style>
</head>
<body>
<header class="top">
<div class="wrap" style="padding-bottom:0;padding-top:0">
<h1>📖 資工專業辭典 <small>CS Dictionary · MVP</small></h1>
<p class="sub">給資工大學生 & 職場新人｜上課聽不懂、實務對不上，3 秒查到 + 拼錯也找得到</p>
<div class="searchbox">
<input id="q" type="text" placeholder="搜英文 / 中文 / 情境，例如：RAG、遞迴、客服機器人…" autocomplete="off">
<span class="icon">🔍</span>
<div class="dropdown" id="dd"></div>
</div>
<div class="correct" id="correct"></div>
</div>
</header>
<div class="wrap">
<div class="pills" id="cats"><span class="meta">載入分類中…</span></div>
<div class="meta">🔥 熱門使用情境（點了直接找技術）：</div>
<div class="tags" id="scens"></div>
<div class="hint">💡 試試容錯搜尋：輸入 <code data-q="RAGg">RAGg</code>、<code data-q="Recusion">Recusion</code>、<code data-q="Polymorphsim">Polymorphsim</code> ｜ 試試情境搜尋：<code data-q="客服機器人">客服機器人</code>、<code data-q="面試">面試</code></div>
<div class="meta" id="count"></div>
<div class="grid" id="grid"></div>
<footer>前端（本頁） + 後端 FastAPI（/api/search、/api/suggest）+ 資料 terms.json · 對應 plan.md §5-§7 · 未來可換 PostgreSQL + pg_trgm</footer>
</div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<script>
const $=s=>document.querySelector(s);
const grid=$('#grid'),dd=$('#dd'),input=$('#q'),correct=$('#correct');
let activeCat='',timer=null,allCats=[];

async function api(p){const r=await fetch(p);return r.json();}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

async function loadMeta(){
  const c=await api('/api/categories');allCats=c.categories||[];
  $('#cats').innerHTML='<button class="pill active" data-c="">全部</button>'+allCats.map(x=>`<button class="pill" data-c="${esc(x)}">${esc(x)}</button>`).join('');
  document.querySelectorAll('#cats .pill').forEach(b=>b.onclick=()=>{document.querySelectorAll('#cats .pill').forEach(x=>x.classList.remove('active'));b.classList.add('active');activeCat=b.dataset.c;doSearch(input.value.trim());});
  const s=await api('/api/scenarios');
  $('#scens').innerHTML=(s.scenarios||[]).slice(0,14).map(x=>`<button class="tag" data-s="${esc(x.name)}">${esc(x.name)} ×${x.count}</button>`).join('');
  document.querySelectorAll('#scens .tag').forEach(b=>b.onclick=()=>{input.value=b.dataset.s;doSearch(b.dataset.s);});
}
function card(t){
  const cats=(t.category||[]).map(x=>`<i>${esc(x)}</i>`).join('');
  const sc=(t.application_scenarios||[]).slice(0,3).map(x=>`<i class="sc">${esc(x)}</i>`).join('');
  return `<div class="card" data-id="${t.id}"><h3>${esc(t.word_en)} <span>${esc(t.word_zh)}</span></h3><div style="font-size:12px;color:#94a3b8">${esc(t.full_name||'')}</div><p>${esc(t.definition||'')}</p><div class="mini">${cats}${sc}</div></div>`;
}
function bindCards(){document.querySelectorAll('.card').forEach(c=>c.onclick=()=>openDetail(c.dataset.id));}
async function openDetail(id){
  const t=await api('/api/terms/'+id);if(t.error)return;
  const rel=(t.related||[]).map(x=>`<button class="tag" data-id="${x.id}">${esc(x.word_en)} ${esc(x.word_zh)}</button>`).join('')||'無';
  $('#sheet').innerHTML=`<button class="x" onclick="document.querySelector('#modal').classList.remove('show')">✕</button>
  <h2>${esc(t.word_en)} <span style="font-size:16px;color:#64748b">${esc(t.word_zh)}</span></h2>
  <div class="full">${esc(t.full_name||'')}</div>
  <div class="def">${esc(t.definition)}</div>
  <div class="mini">${(t.category||[]).map(x=>`<i>📂 ${esc(x)}</i>`).join('')}</div>
  <p style="font-size:14px">🧭 <b>什麼時候會用到？</b></p>
  <div class="tags">${(t.application_scenarios||[]).map(x=>`<button class="tag" data-q2="${esc(x)}">🔖 ${esc(x)}</button>`).join('')}</div>
  <p style="font-size:14px">💬 <b>例句</b></p><div class="ex">${esc(t.example_sentence||'—')}</div>
  <p style="font-size:14px">🔗 <b>相關詞彙</b></p><div class="tags">${rel}</div>`;
  $('#modal').classList.add('show');
  document.querySelectorAll('#sheet [data-id]').forEach(b=>b.onclick=e=>{e.stopPropagation();openDetail(b.dataset.id);});
  document.querySelectorAll('#sheet [data-q2]').forEach(b=>b.onclick=()=>{$('#modal').classList.remove('show');input.value=b.dataset.q2;doSearch(b.dataset.q2);});
}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')e.target.classList.remove('show');});

async function doSearch(q){
  q=(q||'').trim();
  const url='/api/terms?limit=30&q='+encodeURIComponent(q)+(activeCat?'&category='+encodeURIComponent(activeCat):'');
  const d=await api(url);
  const res=d.results||[];
  $('#count').textContent=q?`「${q}」找到 ${res.length} 筆`:`共 ${res.length} 個詞彙（MVP 種子資料 40 筆）`;
  const onlyFuzzy=q&&res.length>0&&res.every(r=>r.match==='fuzzy');
  const noRes=q&&res.length===0;
  if(onlyFuzzy||noRes){
    let sug=[];
    try{const s=await api('/api/suggest?q='+encodeURIComponent(q));sug=s.suggestions||[];}catch(e){}
    const list=(sug.length?sug:res).slice(0,5);
    correct.innerHTML=`⚠️ 找不到「${esc(q)}」，你是不是要找：`+list.map(t=>`<button data-w="${esc(t.word_en)}">${esc(t.word_en)}（${esc(t.word_zh)}）</button>`).join('');
    correct.classList.add('show');
    correct.querySelectorAll('button').forEach(b=>b.onclick=()=>{input.value=b.dataset.w;hideDD();doSearch(b.dataset.w);});
  }else{correct.classList.remove('show');correct.innerHTML='';}
  grid.innerHTML=res.length?res.map(card).join(''):'<div class="card">查無結果，換個關鍵字或點上方推薦試試。</div>';
  bindCards();
}
async function doSuggest(q){
  q=(q||'').trim();if(q.length<1){hideDD();return;}
  const d=await api('/api/search?q='+encodeURIComponent(q)+'&limit=7');
  const items=[...(d.exact||[]),...(d.suggestions||[])].slice(0,7);
  if(!items.length){hideDD();return;}
  const hasFuzzy=(d.exact||[]).length===0&&(d.suggestions||[]).length>0;
  dd.innerHTML=(hasFuzzy?'<div class="dd-label">⚠️ 拼字可能有誤，你是不是要找…？</div>':'<div class="dd-label">即時建議（中/英/情境皆可搜）</div>')
    +items.map(t=>`<div class="dd-item" data-w="${esc(t.word_en)}" data-id="${t.id}"><b>${esc(t.word_en)} <span>${esc(t.word_zh)}</span></b><span>${esc((t.application_scenarios||[])[0]||(t.category||[])[0]||'')}</span></div>`).join('');
  dd.classList.add('show');
  dd.querySelectorAll('.dd-item').forEach(el=>el.onmousedown=()=>{input.value=el.dataset.w;hideDD();doSearch(el.dataset.w);});
}
function hideDD(){dd.classList.remove('show');}
input.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(()=>{doSuggest(input.value);doSearch(input.value);},300);});
input.addEventListener('focus',()=>{if(input.value.trim())doSuggest(input.value.trim());});
document.addEventListener('click',e=>{if(!e.target.closest('.searchbox'))hideDD();});
document.querySelectorAll('.hint code').forEach(c=>c.onclick=()=>{input.value=c.dataset.q;doSearch(c.dataset.q);});
loadMeta().then(()=>doSearch(''));
</script>
</body>
</html>
